name = "per-ankh-share-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# AsyncLocalStorage from node:async_hooks. Backs the request-scoped log
# context in cloud/src/log.ts so handlers can attach fields to the access
# log without threading a context argument through every signature.
# `nodejs_als` is the lightweight flag — full `nodejs_compat` would pull
# in a large compatibility shim we don't need.
compatibility_flags = ["nodejs_als"]

# Custom domain: api.per-ankh.app
# Wrangler creates the DNS record automatically
routes = [{ pattern = "api.per-ankh.app", custom_domain = true }]

# Run the Worker next to its data instead of next to the visitor (issue #150).
#
# The regional storage this Worker reaches is all in ENAM — both D1 databases
# and the R2 bucket (SESSIONS_KV is global and pays no crossing) — so a Worker
# started at the visitor's colo pays a cross-region round trip *per query*,
# not per request. Handlers here issue several: a home page load spends six
# read-budget COUNT(*)s across its API calls, each one ahead of the rows the
# call it gates actually wants. Placement moves the isolate to the data and
# turns N crossings per call into one.
#
# `mode = "smart"` rather than a `region` hint, though Cloudflare's own
# selection table puts a "single back-end service in a known cloud region" in
# the Region row. We do not know the region: there is no published mapping
# from a D1 location to a cloud region, and D1's own location hint is soft
# ("the nearest possible location (by latency)"). An unknown infrastructure
# location is the Smart row by that same table's criterion, and the asymmetry
# settles it — smart reverts itself (UNSUPPORTED_APPLICATION) if the placement
# measures slower, while a wrong `region` pins the Worker to the wrong
# continent silently and permanently.
#
# It is also how the region question gets *answered*: read placement status
# (GET /accounts/{account_id}/workers/services/{worker_name}) and the
# `cf-placement` response header after a deploy. SUCCESS with `remote-IAD` is
# the measurement a hint would have been guessing at. INSUFFICIENT_INVOCATIONS
# is the live risk at ~3k invocations/day spread across colos — that, and only
# that, is the signal to pin `region = "aws:us-east-1"`.
#
# Two things this deliberately does not touch. The `scheduled` handler is
# unaffected (placement applies to fetch), so the nightly precompute gets
# nothing from it. And the root wrangler.toml — the SvelteKit Worker — must
# NOT get this block: it carries an `[assets]` binding, and pinning that
# Worker would drag static-asset serving to ENAM for every visitor.
#
# Inheritable (wrangler's config normalizer resolves it against the top-level
# env), so staging moves with it. Do not duplicate it into [env.staging].
[placement]
mode = "smart"

# A response cache in FRONT of the Worker (issue #291).
#
# Cloudflare Workers run before the cache, so a `new Response()` built here had
# never reached a shared cache — which is why the `s-maxage` directives in the
# handlers were inert, constraining browsers and intermediaries only. This
# block is the supported way to change that: Cloudflare checks the cache before
# running the Worker, and on a hit the Worker does not run at all.
#
# It composes with placement rather than competing with it, and in the order
# that matters: the cache is always consulted *before* placement is
# considered, and the lower tier sits in the data center closest to the
# visitor. So a Sydney hit is served in Sydney and crosses nothing — where a
# KV-based cache (the shape #150 originally designed) would be read *inside*
# the Worker, which after placement is in ENAM, and so would pay the crossing
# on every request. Request collapsing — per cache key, per data center — is
# the herd control the /stats handlers want on a cold key, for free.
#
# THE PREREQUISITE, because enabling this naively is a cross-user leak and not
# a perf change: a `200` with no `Cache-Control` gets RFC 9111 heuristic
# freshness (7200 seconds), and `Cookie` is not in the cache key. Our session
# *is* a cookie and we never use `Authorization`, so a signed-in GET is
# indistinguishable from an anonymous one to this cache. What makes it safe is
# in the Worker, not here:
#
#   - `jsonResponse` emits `private, no-store` by default (cloud/src/util.ts),
#     so a route that never thought about caching cannot be shared.
#   - The routes that may be shared declare it (`sharedCache` in
#     cloud/src/index.ts), with the audit pinned by
#     cloud/src/shared-cache-routes.test.ts.
#
# Turning this on without both is what leaks `GET /v1/auth/me`'s discord_id
# and `GET /v1/users/me/online-ids`'s online_id to everyone for two hours.
# They ship in the same unit of work for that reason.
#
# No compatibility_date bump: `[cache]` mandates no minimum date — the gate is
# Wrangler >= 4.69.0 (>= 4.107.0 for per-entrypoint overrides) and
# cloud/package.json's `^4.0.0` resolves to 4.147.0. Per-entrypoint
# overrides would not help anyway: every GET route spec shares the default
# entrypoint, so there is no per-route opt-in and the default posture above is
# the only lever.
#
# Worker version is in the cache key by default, so every deploy starts cold —
# the same shape the KV stats bundles already have. Inheritable like
# `[placement]`, so staging gets it too; don't duplicate it into
# [env.staging].
[cache]
enabled = true

# Two independent telemetry paths, both with a 7-day queryable window in
# Cloudflare plus an OTLP export for longer retention:
#
#   logs   — the structured JSON lines cloud/src/log.ts emits via console.log.
#   traces — platform-generated spans. NOT emitted by log.ts, so the scrubPii
#            deny-list that gates the log lines does not sit in front of them.
#
# See docs/cloud-deploy-plan.md §6.1.
[observability]
enabled = true

[observability.logs]
enabled = true
# Explicit though 1 is the default: at ~3k invocations/day there's no volume
# reason to sample, and the per-(route × colo) cells issue #150 measures are
# thin enough that dropping any of them costs a defensible p95.
head_sampling_rate = 1
# Keep the Cloudflare-side copy as well as exporting. Explicit because
# Cloudflare's own OTLP example sets this false, and copying that example
# would silently remove the queryable window.
persist = true
# A destination NAME, resolved against account-level destinations created in
# the dashboard (Workers Observability) — not a URL. Nothing in this repo
# creates it, and a name with no matching destination exports nothing and
# reports nothing. Setup in docs/cloud-deploy-plan.md §6.1.2.
destinations = ["per-ankh-logs"]

# Automatic tracing: a span per invocation, plus one per D1 query and R2
# operation, carrying cloudflare.d1.response.sql_duration_ms / rows_read /
# rows_written and the R2 operation outcome. See docs/cloud-deploy-plan.md
# §6.1.4 for what this answers that the access line doesn't.
#
# `enabled = true` is set explicitly rather than inherited from
# `[observability] enabled`. The implication only holds under the
# `enable_workers_observability_tracing` compatibility flag, which our
# compatibility_date (2024-12-01) predates — but the explicit form works at
# any compatibility date, so this needs no date bump. Neither does
# ctx.tracing.enterSpan in src/index.ts (verified against workerd at this
# date, not assumed — the changelog for startActiveSpan implies otherwise).
[observability.traces]
enabled = true
# Same reasoning as the logs sink above, with more headroom to spend: tracing
# multiplies one invocation into ~10 spans, so ~3k invocations/day lands near
# 900k spans/month against Honeycomb's 20M free-tier events. Sampling would
# thin exactly the tail-colo cells issue #150 exists to measure.
head_sampling_rate = 1
# Keep the Cloudflare-side copy as well as exporting — same trap as the logs
# sink: Cloudflare's own OTLP example sets this false, which means "export
# only, keep nothing queryable in Cloudflare".
persist = true
# A separate destination from per-ankh-logs, not a second use of it: a
# destination pins one OTLP endpoint, and traces and logs are different paths
# on the provider (…/v1/traces vs …/v1/logs). Same out-of-band dashboard
# provisioning, same silent failure mode on a typo — §6.1.2.
destinations = ["per-ankh-traces"]

# D1 migrations live in cloud/migrations/ (wrangler's default location),
# applied via:
#   npm run migrate:local    (local sqlite under .wrangler/)
#   npm run migrate:staging  (staging D1)
#   npm run migrate:remote   (production D1)

# R2 blob storage for shared game data
[[r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "per-ankh-shares"

# R2 storage for user-uploaded game screenshots (issue #289). A SECOND bucket
# rather than a prefix in per-ankh-shares, because this one sits behind a
# public R2 custom domain (img.per-ankh.app): the same domain over the shares
# bucket would expose every save blob and ZIP by key. No Worker is in the image
# read path — every object is public, so there is nothing to gate, and reads
# cost no invocations.
[[r2_buckets]]
binding = "SCREENSHOT_BUCKET"
bucket_name = "per-ankh-screenshots"

# Workers AI, for the Clef call that screens a screenshot before it is stored
# (cloud/src/screenshots/clef.ts). Account-level, so prod and staging bind the
# same service; the model variant is pinned in code because the thresholds were
# fitted to it. NOT covered by the `secrets.parity` preflight's binding check,
# which reads the three [[table]] binding kinds — this one is a [section], so
# it is listed there explicitly.
[ai]
binding = "AI"

# D1 database for share index, cloud users/games, and event logging.
#
# Read replication is ENABLED on this database (`read_replication.mode =
# "auto"`). That is not a wrangler setting — it lives on the database itself
# and is set out-of-band, so nothing in this repo applies it:
#
#   Dashboard: D1 → per-ankh-share-index → Settings → Enable Read Replication
#   API:       PUT /accounts/{account_id}/d1/database/{database_id}
#              {"read_replication": {"mode": "auto"}}     (token needs D1:Edit)
#
# Both halves are required and neither errors without the other: the setting is
# inert until a request opens a Sessions API handle (cloud/src/d1.ts), and those
# handles just stay on the primary if the setting is off. A fresh environment
# provisioned without this silently loses the latency win with no signal — so
# it's also a step in docs/cloud-deploy-plan.md §3.10.
[[d1_databases]]
binding = "SHARE_DB"
database_name = "per-ankh-share-index"
database_id = "e57449fd-6c9f-4b16-a013-322f9669182b"
# Explicit (this is the default) now that a second DB has its own dir — keeps
# the two unambiguous: `migrate:*` targets this one, `migrate:security:*` the
# other.
migrations_dir = "migrations"

# D1 database for the Skiff security_events drain (issue #71). Dedicated, NOT
# SHARE_DB, so probe-flood write bursts can't contend with live app queries on
# D1's single-threaded-per-database engine. Drained read-only over the D1 REST
# API; emit chokepoint in src/security-events.ts. Migrations live in
# cloud/migrations-security/, applied out-of-band via `migrate:security:*`
# (deliberately NOT wired into the deploy pipeline — the schema is static).
[[d1_databases]]
binding = "SECURITY_DB"
database_name = "per-ankh-security-events"
database_id = "a1c4b60b-d967-497f-864c-f451364aa9a1"
migrations_dir = "migrations-security"

# KV namespace for OAuth pending state (5min TTL) and sessions (30d TTL).
# Keys are prefixed `oauth:<id>` and `session:<token>` respectively.
# Run once to create:
#   npx wrangler kv namespace create SESSIONS_KV
#   npx wrangler kv namespace create SESSIONS_KV --preview
# Then paste the returned IDs below.
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "b7029ad65b8f410b84b4b55623b25e56"
preview_id = "e4725d2a3a324ec98580f6d6cae1f209"

# Cron triggers. Four jobs, dispatched by exact pattern in the `scheduled`
# handler (src/index.ts) with no fallback — a pattern listed here and matched
# by none of them there logs and does nothing.
#
#   47 3      the retention sweep over the D1 `events` table. Per-event-type
#             policy in src/retention.ts, which also names the pattern
#             (RETENTION_CRON). Followed, on the same trigger, by the ratings
#             and recommended-opponents rebuild (src/ratings/rebuild.ts).
#   17 4..7   the public /stats bundle precompute, one pattern per composition
#             slice (STATS_PRECOMPUTE_CRONS in src/stats/precompute.ts, which
#             maps each to its slice). Four patterns rather than one because
#             both the 1,000-query ceiling and the 128 MB isolate are charged
#             per invocation, and the four slices together are ~856 queries —
#             so a pattern each buys a fresh budget and a fresh isolate. The
#             hourly spacing is load-bearing twice over: it keeps every one of
#             them clear of the others, and an interval of an hour or more is
#             what puts a cron on the 15-minute CPU tier instead of the
#             30-second one.
#   37 *      the /stats warm (STATS_WARM_CRON, same module). Rebuilds any of
#             the four *unfaceted* bundles that is missing, and only those:
#             the 52 nation bundles belong to the nightly patterns above,
#             because all 56 in one invocation is ~856 queries against the
#             1,000 ceiling while the four unfaceted are ~200. Both segments
#             of the cache key are Worker-compiled, so a deploy is what
#             orphans them, and hourly bounds the cold window to one interval
#             rather than to the night's run. Conditional, so the steady state
#             is four KV reads an hour instead of ~5,400 D1 queries a day
#             overwriting entries that were already correct. Hourly and not
#             tighter for the same CPU-tier reason as above.
#
# The five daily patterns are off-peak UTC for the player base and deliberately
# off the hour boundary; the warm runs at :37, clear of both.
[triggers]
crons = ["47 3 * * *", "17 4 * * *", "17 5 * * *", "17 6 * * *", "17 7 * * *", "37 * * * *"]

[vars]
# === Cloud rewrite upload limits ===
# Apply to uploads + reimports together (same R2/D1 work). Set generous —
# reimports are forced by parser-version bumps (BulkReparseModal), so
# anything tight breaks legitimate workflows. Tighten reactively if abuse
# signal appears.
PER_USER_UPLOADS_PER_HOUR = "100"
# 2x PER_USER gives real headroom for shared IPs (households, offices, NAT)
# while still catching single-IP abuse rotating across accounts.
PER_IP_UPLOADS_PER_HOUR = "200"
# Global circuit breaker. Saturates around 50 concurrently-active users —
# a real "something is wrong" threshold, not a normal-growth ceiling.
GLOBAL_UPLOADS_PER_HOUR = "5000"

# === Tournament read limits ===
# Per-IP hourly ceilings on the two tournament read budgets
# (cloud/src/tournament/limits.ts). Vars, not just code consts, so either can
# be retuned during a live event without a redeploy — same lever as
# UPLOADS_ENABLED: `npx wrangler secret put TOURNAMENT_VIEW_PER_HOUR` takes
# effect immediately. Unset or unparseable falls back to the code default,
# which is this number.
#
# The override is temporary. A secret and a var of the same name collide, and
# the var wins: the next `wrangler deploy` warns "Configuration values (…)
# conflict with existing remote secrets. This deployment will replace these
# remote secrets with the configuration values" and puts this number back. So
# an incident-time secret survives only until the next deploy — to keep a new
# ceiling, change it here and ship it.
#
# Three budgets, by the surface that spends them, not by feature:
#   _VIEW_ — the tournament pages (detail + standings/bracket/matches/stats)
#   _LIST_ — GET /v1/tournaments, which the *home page* fetches every render
#   _LINK_ — GET /v1/games/:id/tournament-link, every game-page render
# Separate so the busiest surface can't decide when the others start refusing
# — that coupling is what took the tournament pages down on 2026-08-05, with
# /games/* as the busy surface. Keep them separate when retuning.
#
# All three count *reads*, not page loads, and the numbers differ because the
# fan-out does: _VIEW_ is ~4 reads per tournament page (6 on stats), the other
# two are one read each. So all three are about 600 page loads an hour per
# visitor. Retuning one is deciding how much *browsing* to allow — convert
# through the fan-out, don't copy a number across.
TOURNAMENT_VIEW_PER_HOUR = "2400"
TOURNAMENT_LIST_VIEW_PER_HOUR = "600"
TOURNAMENT_LINK_VIEW_PER_HOUR = "600"

# === Public /stats read limit ===
# Per-IP hourly ceiling on GET /v1/stats (the global chart bundle), on the same
# lever and with the same override caveat as the three tournament ceilings
# above. Its own budget rather than a share of anon_read, for the reason those
# three are separate from each other: /stats and /games/* are different
# populations, and a shared budget lets the busier one decide when the other
# starts refusing.
#
# One read per page load, so 600 is 600 page loads an hour — the arithmetic
# TOURNAMENT_LIST_VIEW_PER_HOUR does at the same number, not a number copied
# across from it.
GLOBAL_STATS_VIEW_PER_HOUR = "600"

# === Public /players read limit ===
# Per-IP hourly ceiling on GET /v1/stats/players (the played-games
# leaderboard), on the same lever and with the same override caveat as the
# ceilings above. Its own budget rather than a share of anon_read — /players and
# /games/* are different populations — and not a share of
# GLOBAL_STATS_VIEW_PER_HOUR either, since /players is anonymous where /stats is
# session-gated, so pooling would let a crawl of the public board decide when
# signed-in visitors stop getting charts.
#
# One read per page load — the board in the URL, and only that board — so 600
# is 600 page loads an hour: the same headroom the ceilings above buy, arrived
# at through this page's fan-out rather than copied across from them. It sat at
# 1200 while the page fetched both boards and spent two slots a load.
SEASON_VIEW_PER_HOUR = "600"

# === Home stats-summary read limit ===
# Per-IP hourly ceiling on GET /v1/home-summary (the home page's stats panels),
# on the same lever and with the same override caveat as the ceilings above.
# Its own budget rather than a share of anon_read even though one home page load
# spends both: anon_read at 200/hr is already the tightest ceiling that page
# meets, so pooling would halve its headroom against itself.
#
# One read per home page load, so 600 is 600 loads an hour — this page's own
# fan-out, not a number copied across. Home also spends 3 tournament_view slots
# and 1 season_view per load, so anon_read stays what actually bounds it.
HOME_SUMMARY_VIEW_PER_HOUR = "600"

# === Challenge read limits ===
# Per-IP hourly ceilings on the two challenge read budgets
# (cloud/src/challenges/handlers.ts), on the tournament lever above. Two, by
# the surface that spends them: _VIEW_ is the challenge pages (list + detail,
# one read each), _LINK_ is GET /v1/games/:id/challenge-link, which every
# game-page render calls — the tournament-link split, for the same incident.
CHALLENGE_VIEW_PER_HOUR = "600"
CHALLENGE_LINK_VIEW_PER_HOUR = "600"

# === Screenshot upload limits ===
# Hourly ceiling on screenshot upload ATTEMPTS per user, on the same lever and
# with the same override caveat as the ceilings above. A different job from the
# 5-per-game / 100-per-account caps in cloud/src/screenshots/handlers.ts: the
# caps bound what is STORED, this bounds what is CLASSIFIED. A refused upload
# spends a Clef call and no quota, so the caps bound an attacker's storage and
# only this bounds their inference spend.
#
# Deliberately tighter than PER_USER_UPLOADS_PER_HOUR (100), because the two
# have opposite shapes: saves get bulk-reuploaded whenever PARSER_VERSION
# moves, screenshots never do. Twenty is four games' worth of strip in an hour
# — well past human use — and bounds one account at ~$0.008 of classification
# an hour.
PER_USER_SCREENSHOTS_PER_HOUR = "20"
# Per-IP hourly ceiling on the two gallery reads (the game-detail strip and the
# profile Screenshots tab), on the same lever as the read ceilings above. One
# budget for both, unlike the challenge/tournament view-vs-link split: those
# divided surfaces with different fan-out, while these two are each one read per
# gallery viewed. Its own budget rather than a share of anon_read, because the
# strip read runs on every /games/[id] render — on the shared budget a crawl of
# game pages would decide when profiles stop showing screenshots.
SCREENSHOT_VIEW_PER_HOUR = "600"
# Per-account hourly ceiling on screenshot REPORTS (moderation layer 2,
# cloud/src/screenshots/moderation.ts). What it bounds is the admin queue, not
# the endpoint: the composite PK on screenshot_reports already holds a reporter
# to one report per screenshot, so one account can only inflate the queue by
# working through the corpus.
#
# Charged on success, unlike PER_USER_SCREENSHOTS_PER_HOUR above, which charges
# before the classifier runs. The counter's rows ARE the reports' accountability
# record and are KEEP_FOREVER (cloud/src/retention.ts), so a row per refused
# attempt would accumulate in a list nothing prunes.
PER_USER_SCREENSHOT_REPORTS_PER_HOUR = "20"
# Public base of the R2 custom domain in front of SCREENSHOT_BUCKET. The Worker
# builds screenshot URLs from this plus the object key, so the host is config
# and the key layout is code. Must stay in step with the hostnames in the
# zone's Cache Rule and with `img-src` in svelte.config.js.
SCREENSHOT_BASE_URL = "https://img.per-ankh.app"
# Zone the image hosts live in, for purge-by-URL when a screenshot is deleted
# (cloud/src/screenshots/purge.ts). A var and not a secret — a zone id is an
# identifier — but still per-deploy, so it is declared in both blocks. One zone
# covers both hostnames, so prod and staging carry the same value.
#
# Not a secret, so it lives here rather than in a secret or .dev.vars: a zone
# id grants nothing on its own and the purge needs it TOGETHER WITH
# CLOUDFLARE_PURGE_TOKEN, which is the credential and is set out-of-band. Same
# id/credential split as DISCORD_CLIENT_ID (below) and DISCORD_CLIENT_SECRET,
# and the `secrets.vars` preflight enforces it by name — a [vars] key ending
# _SECRET/_KEY/_TOKEN/_PASSWORD fails that check, which is why the token can
# never be moved up here.
#
# It also has to be VERSIONED WITH THE CODE that reads it. As a secret, a newly
# created environment would deploy green and silently never purge, and
# `secrets.parity` could not catch it — that check compares the [vars] key sets
# in this file, and a secret is not in it.
#
# UNSET MEANS NO PURGE: the object is deleted and the edge keeps serving it for
# up to the 30-day Edge TTL, logged as `screenshot_purge_unconfigured`.
CLOUDFLARE_ZONE_ID = "bc571c481d1346e551d7ab169b325a9f"

# === Cloud rewrite (/v1/auth/*, /v1/games/*) ===
# CORS allowlist for new routes — comma-separated origins. Cookie-based
# auth requires Access-Control-Allow-Credentials: true, which forbids the
# wildcard origin, so we echo the request Origin if it's in this list.
ALLOWED_ORIGINS = "https://per-ankh.app,http://localhost:1420"
# Discord OAuth client ID. Public per spec §5; kept here for parity with secret.
# Replace with the value from https://discord.com/developers/applications.
DISCORD_CLIENT_ID = "1500901451034263604"
# DISCORD_CLIENT_SECRET is set out-of-band:
#   npx wrangler secret put DISCORD_CLIENT_SECRET
# CLOUDFLARE_PURGE_TOKEN is the other required secret (`secrets.required`
# checks both), a Cache Purge token scoped to the per-ankh.app zone. It clears
# a deleted or hidden screenshot from the edge, which nothing else can do, and
# must be set in BOTH environments:
#   npx wrangler secret put CLOUDFLARE_PURGE_TOKEN
#   npx wrangler secret put CLOUDFLARE_PURGE_TOKEN --env staging
# YOUTUBE_API_KEY (also a secret, set out-of-band) has two uses, both in
# cloud/src/video/youtube.ts: resolving an @handle / legacy /user/ channel URL
# to its channel id when a user links a YouTube channel, and correcting the
# dates on live content, which the RSS feed reports as when the VOD went up
# rather than when the broadcast aired (1 quota unit per channel refresh,
# behind the 1h video cache). It's optional — no preflight requires it (unlike
# DISCORD_CLIENT_SECRET) — but wrangler secrets are per-environment, so set it
# in BOTH or, in whichever env lacks it, handle/username resolution silently
# fails (that env can then only accept a …/channel/UC… URL) and casts show
# their VOD dates:
#   npx wrangler secret put YOUTUBE_API_KEY
#   npx wrangler secret put YOUTUBE_API_KEY --env staging
# ADMIN_CLI_TOKEN (also a secret, set out-of-band) is the bearer token
# `./per-ankh admin reparse-all` presents, and the one credential on this
# Worker that is not a session. The reparse sweep parses saves locally and
# posts each one to POST /v1/admin/games/:user_id/reparse-upload, which is
# where the token is checked (siteAdminFromCliToken, src/admin.ts); every other
# /v1/admin/* route stays session-only, so the token opens one write and no
# reads. Optional, and no preflight requires it: unset means that endpoint is
# reachable only by a logged-in admin, which is the state before the sweep
# existed, so the symptom of a missing secret is the CLI's own 404 rather than
# anything silent. It also needs ADMIN_DISCORD_ID set in the same environment
# — the admin's user_id is resolved from it for the audit row — and that
# account must have signed in at least once. Per-environment:
#   npx wrangler secret put ADMIN_CLI_TOKEN
#   npx wrangler secret put ADMIN_CLI_TOKEN --env staging
# Session cookie name. A var (not a code const) so staging can use a distinct
# name: both environments set Domain=per-ankh.app on the session cookie (the
# only shared ancestor of their sibling subdomains), so a staging cookie named
# "session" would clobber the prod session in the same browser. The Miniflare
# test harness loads this top-level [vars] block, and the integration tests
# hardcode `session=` — keep this value "session".
SESSION_COOKIE_NAME = "session"

# ─────────────────────────────────────────────────────────────────────────────
# Staging environment (api-staging.per-ankh.app).
#
# Wrangler 4 inheritance rules (verified against wrangler's config source):
#   - vars, d1_databases, kv_namespaces, r2_buckets are NOT inherited — every
#     binding and var below is a deliberate full duplicate of the top level.
#     The `secrets.parity` preflight check enforces that the key sets match.
#   - routes IS inherited — this block MUST declare its own routes. If it were
#     removed, `wrangler deploy --env staging` would inherit the prod route and
#     attach api.per-ankh.app to the staging worker.
#   - triggers IS inherited — the [env.staging.triggers] block below replaces
#     the inherited list wholesale, so staging runs the /stats precompute and
#     not the retention sweep.
#   - observability IS inherited, nested tables included — staging gets the
#     same hot windows and exports to the same OTLP destinations (logs and
#     traces alike) with no duplicate keys here. Exported records carry the
#     script name, so staging and prod stay distinguishable at the
#     destination; spans carry it as the cloudflare.script_name resource
#     attribute, present on every span.
#   - placement and cache ARE inherited (verified against wrangler's config
#     normalizer, which resolves both against the top-level env) — staging
#     runs in the same region and behind the same response cache as prod, and
#     duplicating either block here would only let the two drift.
#   - main / compatibility_date / compatibility_flags are inherited; not
#     repeated here.
#
# Secrets are per-environment: DISCORD_CLIENT_SECRET and CLOUDFLARE_PURGE_TOKEN
# (and optionally ADMIN_DISCORD_ID) must be set with
# `wrangler secret put <NAME> --env staging`.
# ─────────────────────────────────────────────────────────────────────────────
[env.staging]
routes = [{ pattern = "api-staging.per-ankh.app", custom_domain = true }]

# Replaces the inherited list (see top-level comment). The /stats precompute
# and warm both run here so the cron path is exercised before prod; the
# retention sweep is left out because staging D1 is recloned from prod and an
# independent sweep there would skew prod/staging diffs. Neither stats job has
# that problem — both only read D1, and write to staging's own KV.
[env.staging.triggers]
crons = ["17 4 * * *", "17 5 * * *", "17 6 * * *", "17 7 * * *", "37 * * * *"]

[[env.staging.r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "per-ankh-shares-staging"

# Behind img.staging.per-ankh.app — a second-level subdomain, which Universal
# SSL does not cover on a full-setup zone; R2's own custom-hostname
# certificate does.
[[env.staging.r2_buckets]]
binding = "SCREENSHOT_BUCKET"
bucket_name = "per-ankh-screenshots-staging"

[env.staging.ai]
binding = "AI"

# Read replication is enabled here too — same out-of-band step as the prod
# database (see the top-level SHARE_DB comment). Staging carries it so a
# replica-served route is exercised before prod, not first discovered there.
[[env.staging.d1_databases]]
binding = "SHARE_DB"
database_name = "per-ankh-share-index-staging"
# Paste from `wrangler d1 create per-ankh-share-index-staging`:
database_id = "74cb5f03-fe51-4770-81dc-da7ac600b911"
migrations_dir = "migrations"

# Staging security_events DB (see top-level SECURITY_DB comment). Binding name
# must match prod — the secrets.parity preflight enforces it. Staging is opted
# out of the nightly cron, so this DB won't auto-prune (fine: low volume,
# disposable, recloned).
[[env.staging.d1_databases]]
binding = "SECURITY_DB"
database_name = "per-ankh-security-events-staging"
database_id = "ee9c92dc-0f4f-4fbe-a033-5f87c58d37f5"
migrations_dir = "migrations-security"

[[env.staging.kv_namespaces]]
binding = "SESSIONS_KV"
# Paste from `wrangler kv namespace create SESSIONS_KV --env staging` (+ --preview):
id = "1db613e81532484189d37ad410584264"
preview_id = "be620b722e444391bc73cfed9b2863c8"

[env.staging.vars]
# Every top-level [vars] key is duplicated here (wrangler does not inherit
# vars; secrets.parity enforces the key sets match). Values differ only where
# the environment differs.
PER_USER_UPLOADS_PER_HOUR = "100"
PER_IP_UPLOADS_PER_HOUR = "200"
GLOBAL_UPLOADS_PER_HOUR = "5000"
TOURNAMENT_VIEW_PER_HOUR = "2400"
TOURNAMENT_LIST_VIEW_PER_HOUR = "600"
TOURNAMENT_LINK_VIEW_PER_HOUR = "600"
GLOBAL_STATS_VIEW_PER_HOUR = "600"
SEASON_VIEW_PER_HOUR = "600"
HOME_SUMMARY_VIEW_PER_HOUR = "600"
CHALLENGE_VIEW_PER_HOUR = "600"
CHALLENGE_LINK_VIEW_PER_HOUR = "600"
PER_USER_SCREENSHOTS_PER_HOUR = "20"
SCREENSHOT_VIEW_PER_HOUR = "600"
PER_USER_SCREENSHOT_REPORTS_PER_HOUR = "20"
SCREENSHOT_BASE_URL = "https://img.staging.per-ankh.app"
# Same zone as prod — img.staging.per-ankh.app is a hostname in per-ankh.app,
# which is why one purge token covers both, and why this is the same id. See
# the top-level block for why it is a var and not a secret.
CLOUDFLARE_ZONE_ID = "bc571c481d1346e551d7ab169b325a9f"
ALLOWED_ORIGINS = "https://staging.per-ankh.app"
# Separate staging Discord OAuth app — paste its client ID:
DISCORD_CLIENT_ID = "1512545079493922927"
# Distinct cookie name so staging logins can't clobber the prod session
# (both envs share Domain=per-ankh.app — see the top-level comment).
SESSION_COOKIE_NAME = "session_staging"
