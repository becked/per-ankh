<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon-32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="512x512"
			href="%sveltekit.assets%/favicon.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		<!--
			The UI face's upright (src/app.css, which declares the italic too and
			says why that one isn't preloaded). Preloaded because it is discovered
			only once the stylesheet has parsed, which is late enough that the
			`font-display: swap` fallback gets a turn — and a swap is visible here,
			where `auto 1fr` grids and ~80 ellipsis labels are measured from text.
			`crossorigin` is required even same-origin: fonts are fetched in CORS
			mode, and without it the preload is discarded and refetched.
		-->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/InterVariable-latin-opsz.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
